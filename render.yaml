services:
  - type: web
    name: option-engine
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    plan: free          # live use ke liye "starter" (~$7) lo, free so jaata hai aur login RAM se ud jaata hai
